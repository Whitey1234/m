<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blooming Rose with Heartbeat and Heart Rain</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #ffe6f2; /* Light pink background */
      margin: 0;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      position: relative;
    }

    /* Heart Rain Animation */
    .hearts {
      position: absolute;
      top: -10%;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .heart {
      position: absolute;
      color: #ff1493;
      font-size: 20px;
      animation: fall linear infinite;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh);
      }
    }

    .container {
      position: relative;
      text-align: center;
      z-index: 1;
    }

    .rose {
      width: 100px;
      height: 100px;
      background: linear-gradient(45deg, #ff1493, #ff69b4);
      border-radius: 50%;
      position: relative;
      animation: heartbeat 1.5s infinite, bloom 3s forwards;
      transform: scale(0);
      box-shadow: 0 0 20px rgba(255, 20, 147, 0.5);
    }

    .rose::before,
    .rose::after {
      content: '';
      position: absolute;
      width: 100px;
      height: 100px;
      background: linear-gradient(45deg, #ff1493, #ff69b4);
      border-radius: 50%;
    }

    .rose::before {
      top: -50px;
      left: 0;
    }

    .rose::after {
      top: 0;
      left: -50px;
    }

    .message {
      margin-top: 30px;
      font-size: 24px;
      color: #ff1493;
      animation: fadeIn 3s forwards;
      opacity: 0;
    }

    .image {
      margin-top: 20px;
      width: 150px;
      height: auto;
      border-radius: 50%;
      animation: blink 1.5s infinite;
      box-shadow: 0 0 15px rgba(255, 20, 147, 0.7);
    }

    .footer {
      margin-top: 20px;
      font-size: 16px;
      color: #ff69b4;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
    }

    @keyframes bloom {
      0% {
        transform: scale(0);
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    @keyframes blink {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    @media (max-width: 768px) {
      .rose {
        width: 80px;
        height: 80px;
      }

      .message {
        font-size: 20px;
      }

      .image {
        width: 120px;
        border: 2px solid red;
        border-radius: 100%;
      }

      .footer {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <!-- Heart Rain -->
  <div class="hearts">
    <!-- Hearts will be dynamically added here -->
  </div>

  <!-- Rose and Message -->
  <div class="container">
    <div class="rose"></div>
    <div class="message">Mariya Mam, Happy Valentine's Day!</div>
    <!-- Replace the image path with a valid one -->
    <img src="WhatsApp Image 2025-02-05 at 1.40.48 AM.jpeg" alt="Valentine's Image" class="image">
    <div class="footer">Created by Najmul</div>
  </div>

  <script>
    // Function to create falling hearts
    function createHearts() {
      const heartsContainer = document.querySelector('.hearts');
      const heartCount = 50; // Number of hearts

      for (let i = 0; i < heartCount; i++) {
        const heart = document.createElement('div');
        heart.innerHTML = '❤️';
        heart.classList.add('heart');
        heart.style.left = `${Math.random() * 100}vw`; // Random horizontal position
        heart.style.animationDuration = `${Math.random() * 3 + 2}s`; // Random fall speed
        heart.style.fontSize = `${Math.random() * 20 + 10}px`; // Random size
        heartsContainer.appendChild(heart);
      }
    }

    // Start creating hearts
    createHearts();
  </script>
</body>
</html>
